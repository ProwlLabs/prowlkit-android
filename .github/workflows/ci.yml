name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: ./gradlew :prowl-core:testDebugUnitTest --no-daemon

      - name: Compile libraries
        run: ./gradlew :prowl:compileReleaseKotlin :prowl-ui:compileReleaseKotlin --no-daemon
