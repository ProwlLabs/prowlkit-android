name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version to publish (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      target:
        description: "Publish target"
        required: true
        default: "github"
        type: choice
        options:
          - github
          - maven-central

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Write publish.properties
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          VERSION="${VERSION#v}"
          cat > publish.properties <<EOF
          GROUP=io.github.prowllabs
          VERSION=${VERSION}
          GITHUB_ACTOR=${GITHUB_ACTOR}
          GITHUB_TOKEN=${GITHUB_TOKEN}
          MAVEN_CENTRAL_USERNAME=${MAVEN_CENTRAL_USERNAME}
          MAVEN_CENTRAL_PASSWORD=${MAVEN_CENTRAL_PASSWORD}
          SIGNING_KEY=${SIGNING_KEY}
          SIGNING_PASSWORD=${SIGNING_PASSWORD}
          EOF

      - name: Publish to GitHub Packages
        if: github.event_name == 'release' || inputs.target == 'github'
        run: ./gradlew publishAllToGitHubPackages --no-daemon

      - name: Publish to Maven Central
        if: inputs.target == 'maven-central'
        run: ./gradlew publishAllToMavenCentral --no-daemon
