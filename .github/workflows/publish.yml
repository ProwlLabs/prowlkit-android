name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version to publish (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      target:
        description: "Publish target"
        required: true
        default: "github"
        type: choice
        options:
          - github
          - maven-central
          - all

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RELEASE_TAG:-$INPUT_VERSION}"
          VERSION="${VERSION#v}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Write publish.properties
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          cat > publish.properties <<EOF
          GROUP=io.github.prowllabs
          VERSION=${VERSION}
          GITHUB_ACTOR=${GITHUB_ACTOR}
          GITHUB_TOKEN=${GITHUB_TOKEN}
          MAVEN_CENTRAL_USERNAME=${MAVEN_CENTRAL_USERNAME}
          MAVEN_CENTRAL_PASSWORD=${MAVEN_CENTRAL_PASSWORD}
          SIGNING_KEY=${SIGNING_KEY}
          SIGNING_PASSWORD=${SIGNING_PASSWORD}
          POM_URL=https://github.com/ProwlLabs/prowlkit-android
          POM_SCM_URL=https://github.com/ProwlLabs/prowlkit-android
          POM_SCM_CONNECTION=scm:git:git://github.com/ProwlLabs/prowlkit-android.git
          POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/ProwlLabs/prowlkit-android.git
          POM_LICENSE_NAME=MIT License
          POM_LICENSE_URL=https://opensource.org/licenses/MIT
          POM_DEVELOPER_ID=prowllabs
          POM_DEVELOPER_NAME=ProwlLabs
          EOF

      - name: Run tests
        run: ./gradlew :prowl-core:testDebugUnitTest --no-daemon

      - name: Publish to GitHub Packages
        if: >
          github.event_name == 'release' ||
          inputs.target == 'github' ||
          inputs.target == 'all'
        run: ./gradlew publishAllToGitHubPackages --no-daemon

      - name: Publish to Maven Central
        if: inputs.target == 'maven-central' || inputs.target == 'all'
        run: ./gradlew publishAllToMavenCentral --no-daemon
